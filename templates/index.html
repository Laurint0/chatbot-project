<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome per icone -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Marked.js per il rendering del Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js per la formattazione del codice -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Collega il file CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="menu-btn-container">
        <div class="menu-btn" id="menu-btn">
            <i class="fas fa-bars" id="menu-icon"></i>
        </div>
    </div>
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-search" id="search-btn"></i>
            </div>
            <div class="new-chat-btn" onclick="startNewChat()">
                <i class="fas fa-plus"></i> Nuova Chat
            </div>
            <input type="text" class="search-input" id="search-input" placeholder="Cerca chat...">
            <div id="chat-list"></div>
        </div>
        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header">
                <i class="fas fa-download" id="download-btn"></i>
                <i class="fas fa-times" id="close-btn"></i>
            </div>
            <div class="chat-messages" id="messages">
                <div class="welcome-container" id="welcome-container">
                    <img src="/static/continuity.png" alt="Logo">
                    <p>Di cosa hai bisogno?</p>
                    <div class="agent-selection" id="agent-selection">
                        <div class="agent-btn" onclick="selectAgent('google')">Google Agent</div>
                        <div class="agent-btn" onclick="selectAgent('rag')">RAG Agent</div>
                    </div>
                </div>
                <div class="messages-container" id="messages-container"></div>
            </div>
            <div class="chat-input" id="chat-input">
                <div class="input-container">
                    <input
                        type="text"
                        id="message"
                        name="message"
                        placeholder="Scrivi un messaggio..."
                        required
                    />
                    <i class="fas fa-microphone" id="mic-btn"></i>
                    <i class="fas fa-paper-plane" id="send-btn"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Collega il file JavaScript -->
    <script src="/static/js/scripts.js"></script>
</body>
</html>
